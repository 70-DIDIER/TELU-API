components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Jeton personnel Laravel Sanctum. En-tête `Authorization: Bearer <token>`.'

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
      description: Numéro de page (pagination Laravel).
    StatusFilter:
      name: status
      in: query
      schema: { type: string }
      description: Filtre par statut.
    ProductId: { name: product, in: path, required: true, schema: { type: string, format: uuid } }
    OrderId: { name: order, in: path, required: true, schema: { type: string, format: uuid } }
    DeliveryId: { name: delivery, in: path, required: true, schema: { type: string, format: uuid } }
    PropertyId: { name: property, in: path, required: true, schema: { type: string, format: uuid } }
    ReservationId: { name: reservation, in: path, required: true, schema: { type: string, format: uuid } }
    JobOfferId: { name: jobOffer, in: path, required: true, schema: { type: string, format: uuid } }
    ApplicationId: { name: application, in: path, required: true, schema: { type: string, format: uuid } }
    PaymentId: { name: payment, in: path, required: true, schema: { type: string, format: uuid } }
    VendorId: { name: vendor, in: path, required: true, schema: { type: string, format: uuid } }
    AddressId: { name: address, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    Unauthorized:
      description: Non authentifié (jeton manquant ou invalide).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Profil requis absent ou ressource non détenue.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Ressource introuvable ou non accessible.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflit (doublon, profil déjà existant, paiement déjà réussi...).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnprocessableState:
      description: Transition d'état interdite ou pré-condition métier non remplie.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: Trop de requêtes (throttle OTP). En-tête `Retry-After`.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    GatewayError:
      description: Passerelle PayGate / SMS injoignable ou refus.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Erreur de validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }

  schemas:

    # ---------- Génériques
    Error:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    Paginated:
      type: object
      description: Réponse paginée standard de Laravel (`LengthAwarePaginator`).
      properties:
        current_page: { type: integer }
        data: { type: array, items: { type: object } }
        first_page_url: { type: string }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    # ---------- Auth / OTP
    RegisterRequest:
      type: object
      required: [full_name, phone, password, password_confirmation, user_type]
      properties:
        full_name: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 255, description: 'Unique.' }
        email: { type: string, format: email, nullable: true }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }
        user_type: { type: string, enum: [client, vendor, driver, property_owner, recruiter, job_seeker] }
        profile_photo: { type: string, nullable: true }
        current_latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
        current_longitude: { type: number, minimum: -180, maximum: 180, nullable: true }
        otp_token: { type: string, nullable: true, description: 'Requis si OTP_REQUIRED_FOR_REGISTRATION=true.' }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, description: 'Email ou téléphone (auto-détecté).' }
        password: { type: string }
        device_name: { type: string, nullable: true }
    AuthTokenResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    UpdateMeRequest:
      type: object
      properties:
        full_name: { type: string, maxLength: 255 }
        email: { type: string, format: email, nullable: true }
        profile_photo: { type: string, nullable: true }
        current_latitude: { type: number, nullable: true }
        current_longitude: { type: number, nullable: true }
    PhoneRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, maxLength: 30 }
    VerifyOtpRequest:
      type: object
      required: [code]
      properties:
        phone: { type: string, maxLength: 30, description: 'Requis si non authentifié.' }
        code: { type: string, pattern: '^[0-9]{4,8}$' }
    ResetPasswordRequest:
      type: object
      required: [phone, reset_token, password, password_confirmation]
      properties:
        phone: { type: string, maxLength: 30 }
        reset_token: { type: string }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }

    # ---------- Profils métier (requêtes)
    VendorProfileRequest:
      type: object
      required: [shop_name]
      properties:
        shop_name: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        address: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
    DriverProfileRequest:
      type: object
      required: [vehicle_type]
      properties:
        vehicle_type: { type: string, maxLength: 255 }
        license_number: { type: string, nullable: true }
        coverage_zone: { type: string, nullable: true }
        is_available: { type: boolean }
        current_latitude: { type: number, nullable: true }
        current_longitude: { type: number, nullable: true }
    PropertyOwnerProfileRequest:
      type: object
      required: [owner_type]
      properties:
        owner_type: { type: string, enum: [individual, hotel] }
        company_name: { type: string, nullable: true, description: 'Requis si owner_type=hotel.' }
    RecruiterProfileRequest:
      type: object
      properties:
        company_name: { type: string, nullable: true }
        industry: { type: string, nullable: true }
    JobSeekerProfileRequest:
      type: object
      properties:
        profession: { type: string, nullable: true }
        skills: { type: string, nullable: true }
        experience: { type: string, nullable: true }
        availability: { type: string, nullable: true }

    # ---------- Commerce (requêtes)
    ProductRequest:
      type: object
      required: [name, price]
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        price: { type: number, minimum: 0 }
        category: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        stock: { type: integer, minimum: 0, nullable: true }
        is_available: { type: boolean }
    StoreOrderRequest:
      type: object
      required: [vendor_id, delivery_address, items]
      properties:
        vendor_id: { type: string, format: uuid }
        delivery_address: { type: string, maxLength: 255 }
        delivery_latitude: { type: number, nullable: true }
        delivery_longitude: { type: number, nullable: true }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }

    # ---------- Immobilier (requêtes)
    PropertyRequest:
      type: object
      required: [title, property_type, address, price, price_unit]
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        property_type: { type: string, enum: [room, studio, apartment, house, hotel_room] }
        address: { type: string, maxLength: 255 }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        price: { type: number, minimum: 0 }
        price_unit: { type: string, enum: [night, month] }
        bedrooms: { type: integer, minimum: 0, nullable: true }
        image_urls: { type: string, nullable: true }
        is_available: { type: boolean }
    StoreReservationRequest:
      type: object
      required: [property_id, check_in, check_out]
      properties:
        property_id: { type: string, format: uuid }
        check_in: { type: string, format: date, description: '>= aujourd''hui.' }
        check_out: { type: string, format: date, description: '> check_in.' }

    # ---------- Emplois (requêtes)
    JobOfferRequest:
      type: object
      required: [title, location, daily_rate, start_date]
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        location: { type: string, maxLength: 255 }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        daily_rate: { type: number, minimum: 0 }
        required_skills: { type: string, nullable: true }
        start_date: { type: string, format: date }
        duration: { type: string, nullable: true }
        people_needed: { type: integer, minimum: 1, nullable: true }
        is_active: { type: boolean }

    # ---------- Transverses (requêtes)
    StorePaymentRequest:
      type: object
      required: [reference_type, reference_id, payment_method, phone_number]
      properties:
        reference_type: { type: string, enum: [order, reservation, subscription] }
        reference_id: { type: string, format: uuid }
        payment_method: { type: string, enum: [flooz, tmoney] }
        phone_number: { type: string, pattern: '^[0-9]{8}$', description: 'Numéro togolais à 8 chiffres.' }
    PayGateCallbackRequest:
      type: object
      required: [identifier]
      properties:
        identifier: { type: string }
        tx_reference: { type: string, nullable: true }
        payment_reference: { type: string, nullable: true }
        amount: { type: number, nullable: true }
        datetime: { type: string, nullable: true }
        payment_method: { type: string, nullable: true }
        phone_number: { type: string, nullable: true }
    StoreWithdrawalRequest:
      type: object
      required: [amount, phone_number]
      properties:
        amount: { type: number, minimum: 1 }
        phone_number: { type: string, pattern: '^[0-9]{8}$' }
    AddressRequest:
      type: object
      required: [label, address]
      properties:
        label: { type: string, maxLength: 100 }
        address: { type: string, maxLength: 255 }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        is_default: { type: boolean }
    StoreMessageRequest:
      type: object
      required: [receiver_id, content]
      properties:
        receiver_id: { type: string, format: uuid, description: 'Doit exister et ne pas être soi-même.' }
        content: { type: string, maxLength: 2000 }
    StoreRatingRequest:
      type: object
      required: [target_type, target_id, score]
      properties:
        target_type: { type: string, enum: [vendor, driver, property_owner, recruiter, job_seeker] }
        target_id: { type: string, format: uuid }
        score: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000, nullable: true }
    SubscriptionRequest:
      type: object
      required: [name, price, duration_days, subscriber_type]
      properties:
        name: { type: string, maxLength: 255 }
        price: { type: number, minimum: 0 }
        duration_days: { type: integer, minimum: 1 }
        features: { type: string, nullable: true }
        subscriber_type: { type: string, enum: [property_owner, recruiter] }

    # ---------- Entités (réponses)
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        user_type: { type: string, enum: [client, vendor, driver, property_owner, recruiter, job_seeker, admin] }
        status: { type: string, enum: [active, suspended] }
        is_verified: { type: boolean }
        phone_verified_at: { type: string, format: date-time, nullable: true }
        profile_photo: { type: string, nullable: true }
        current_latitude: { type: number, nullable: true }
        current_longitude: { type: number, nullable: true }
        created_at: { type: string, format: date-time }
    Vendor:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        shop_name: { type: string }
        description: { type: string, nullable: true }
        address: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
    Driver:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        vehicle_type: { type: string }
        license_number: { type: string, nullable: true }
        coverage_zone: { type: string, nullable: true }
        is_available: { type: boolean }
        current_latitude: { type: number, nullable: true }
        current_longitude: { type: number, nullable: true }
    PropertyOwner:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        owner_type: { type: string, enum: [individual, hotel] }
        company_name: { type: string, nullable: true }
        subscription_id: { type: string, format: uuid, nullable: true }
        subscription_expires_at: { type: string, format: date-time, nullable: true }
    Recruiter:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        company_name: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        subscription_id: { type: string, format: uuid, nullable: true }
        subscription_expires_at: { type: string, format: date-time, nullable: true }
    JobSeeker:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        profession: { type: string, nullable: true }
        skills: { type: string, nullable: true }
        experience: { type: string, nullable: true }
        availability: { type: string, nullable: true }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: number }
        category: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        stock: { type: integer }
        is_available: { type: boolean }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, preparing, in_delivery, delivered, cancelled] }
        total_amount: { type: number }
        delivery_fee: { type: number }
        commission_amount: { type: number }
        vendor_net_amount: { type: number }
        delivery_address: { type: string }
        delivery_latitude: { type: number, nullable: true }
        delivery_longitude: { type: number, nullable: true }
        wallet_settled_at: { type: string, format: date-time, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        created_at: { type: string, format: date-time }
    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        quantity: { type: integer }
        unit_price: { type: number }
    Delivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [awaiting_driver, assigned, picked_up, delivered] }
        delivery_fee: { type: number }
        commission_amount: { type: number }
        driver_net_amount: { type: number }
        delivery_time: { type: string, format: date-time, nullable: true }
    Property:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        property_type: { type: string, enum: [room, studio, apartment, house, hotel_room] }
        address: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        price: { type: number }
        price_unit: { type: string, enum: [night, month] }
        bedrooms: { type: integer, nullable: true }
        image_urls: { type: string, nullable: true }
        is_available: { type: boolean }
    Reservation:
      type: object
      properties:
        id: { type: string, format: uuid }
        property_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        check_in: { type: string, format: date }
        check_out: { type: string, format: date }
        total_price: { type: number }
        status: { type: string, enum: [pending, confirmed, cancelled, completed] }
    JobOffer:
      type: object
      properties:
        id: { type: string, format: uuid }
        recruiter_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        location: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        daily_rate: { type: number }
        required_skills: { type: string, nullable: true }
        start_date: { type: string, format: date }
        duration: { type: string, nullable: true }
        people_needed: { type: integer, nullable: true }
        is_active: { type: boolean }
    JobApplication:
      type: object
      properties:
        id: { type: string, format: uuid }
        job_offer_id: { type: string, format: uuid }
        job_seeker_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, rejected, completed] }
        applied_at: { type: string, format: date-time }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        reference_type: { type: string, enum: [order, reservation, subscription] }
        reference_id: { type: string, format: uuid }
        amount: { type: number }
        payment_method: { type: string, enum: [flooz, tmoney] }
        status: { type: string, enum: [pending, success, failed, refunded] }
        identifier: { type: string, description: 'Notre référence TELU-XXXXXXXXXXXX envoyée à PayGate.' }
        transaction_id: { type: string, nullable: true, description: 'tx_reference PayGate.' }
        payment_reference: { type: string, nullable: true, description: 'Reçu Flooz/TMoney.' }
        phone_number: { type: string, nullable: true }
        paygate_fee_amount: { type: number, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price: { type: number }
        duration_days: { type: integer }
        features: { type: string, nullable: true }
        subscriber_type: { type: string, enum: [property_owner, recruiter] }
    Wallet:
      type: object
      properties:
        id: { type: string, format: uuid }
        walletable_type: { type: string }
        walletable_id: { type: string, format: uuid }
        balance: { type: number }
        transactions: { type: array, items: { $ref: '#/components/schemas/WalletTransaction' } }
    WalletTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        type: { type: string, enum: [credit, debit] }
        amount: { type: number }
        balance_after: { type: number }
        reference_type: { type: string, nullable: true }
        reference_id: { type: string, format: uuid, nullable: true }
        description: { type: string, nullable: true }
    WithdrawalRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        amount: { type: number }
        phone_number: { type: string }
        status: { type: string, enum: [pending, paid, rejected] }
        processed_at: { type: string, format: date-time, nullable: true }
        processed_by: { type: string, format: uuid, nullable: true }
    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        label: { type: string }
        address: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        is_default: { type: boolean }
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        receiver_id: { type: string, format: uuid }
        content: { type: string }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Conversation:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        last_message: { $ref: '#/components/schemas/Message' }
        unread_count: { type: integer }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        type: { type: string }
        message: { type: string }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Rating:
      type: object
      properties:
        id: { type: string, format: uuid }
        rater_id: { type: string, format: uuid }
        target_type: { type: string, enum: [vendor, driver, property_owner, recruiter, job_seeker] }
        target_id: { type: string, format: uuid }
        score: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
    Setting:
      type: object
      properties:
        key: { type: string }
        value: { type: string }
        type: { type: string, enum: [string, integer, decimal, boolean] }
        group: { type: string, nullable: true }
        description: { type: string, nullable: true }
