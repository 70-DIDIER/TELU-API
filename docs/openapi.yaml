      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: property_type, in: query, schema: { type: string, enum: [room, studio, apartment, house, hotel_room] } }
        - { name: price_unit, in: query, schema: { type: string, enum: [night, month] } }
        - { name: owner_id, in: query, schema: { type: string, format: uuid } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: bedrooms, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }

  /api/properties/{property}:
    get:
      tags: [Immobilier - Biens]
      summary: Détail d'un bien
      parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
      responses:
        '200': { description: Bien., content: { application/json: { schema: { $ref: '#/components/schemas/Property' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/property-owner/properties:
    get:
      tags: [Immobilier - Biens]
      summary: Mes biens (propriétaire)
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Immobilier - Biens]
      summary: Publier un bien (propriétaire)
      description: Sans abonnement actif, limité au quota gratuit (`property_free_quota`, défaut 3) → 403 au-delà.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyRequest' } } } }
      responses:
        '201': { description: Créé., content: { application/json: { schema: { $ref: '#/components/schemas/Property' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/property-owner/properties/{property}:
    get:
      tags: [Immobilier - Biens]
      summary: Détail d'un de mes biens (propriétaire)
      parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
      responses:
        '200': { description: Bien., content: { application/json: { schema: { $ref: '#/components/schemas/Property' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Immobilier - Biens]
      summary: Mettre à jour un de mes biens (propriétaire)
      parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyRequest' } } } }
      responses:
        '200': { description: Mis à jour., content: { application/json: { schema: { $ref: '#/components/schemas/Property' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Immobilier - Biens]
      summary: Supprimer un de mes biens (propriétaire)
      parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
      responses:
        '200': { description: Supprimé. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================ IMMOBILIER - RÉSERVATIONS
  /api/reservations:
    get:
      tags: [Immobilier - Réservations]
      summary: Mes réservations (client)
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
    post:
      tags: [Immobilier - Réservations]
      summary: Réserver un bien (client)
      description: '`total_price` calculé côté serveur. Refuse le chevauchement d''une réservation active (intervalles semi-ouverts).'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StoreReservationRequest' } } } }
      responses:
        '201': { description: Réservation créée., content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/reservations/{reservation}:
    get:
      tags: [Immobilier - Réservations]
      summary: Détail d'une de mes réservations (client)
      parameters: [ { $ref: '#/components/parameters/ReservationId' } ]
      responses:
        '200': { description: Réservation., content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/reservations/{reservation}/cancel:
    post:
      tags: [Immobilier - Réservations]
      summary: Annuler une réservation (client)
      description: Autorisé uniquement depuis `pending|confirmed`.
      parameters: [ { $ref: '#/components/parameters/ReservationId' } ]
      responses:
        '200': { description: Annulée., content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableState' }

  /api/property-owner/reservations:
    get:
      tags: [Immobilier - Réservations]
      summary: Réservations reçues (propriétaire)
      parameters: [ { $ref: '#/components/parameters/StatusFilter' } ]
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/property-owner/reservations/{reservation}/status:
    patch:
      tags: [Immobilier - Réservations]
      summary: Changer le statut d'une réservation (propriétaire)
      description: 'Transitions : `pending→confirmed|cancelled`, `confirmed→completed|cancelled`.'
      parameters: [ { $ref: '#/components/parameters/ReservationId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [confirmed, cancelled, completed] }
      responses:
        '200': { description: Statut mis à jour., content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableState' }

