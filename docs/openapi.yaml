        '404': { $ref: '#/components/responses/NotFound' }

  /api/recruiter/job-offers:
    get:
      tags: [Emplois - Offres]
      summary: Mes offres (recruteur)
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Emplois - Offres]
      summary: Publier une offre (recruteur)
      description: Sans abonnement actif, limité au quota gratuit (`job_offer_free_quota`, défaut 3) → 403 au-delà.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JobOfferRequest' } } } }
      responses:
        '201': { description: Créée., content: { application/json: { schema: { $ref: '#/components/schemas/JobOffer' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/recruiter/job-offers/{jobOffer}:
    get:
      tags: [Emplois - Offres]
      summary: Détail d'une de mes offres (recruteur)
      parameters: [ { $ref: '#/components/parameters/JobOfferId' } ]
      responses:
        '200': { description: Offre., content: { application/json: { schema: { $ref: '#/components/schemas/JobOffer' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Emplois - Offres]
      summary: Mettre à jour une de mes offres (recruteur)
      parameters: [ { $ref: '#/components/parameters/JobOfferId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JobOfferRequest' } } } }
      responses:
        '200': { description: Mise à jour., content: { application/json: { schema: { $ref: '#/components/schemas/JobOffer' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Emplois - Offres]
      summary: Supprimer une de mes offres (recruteur)
      parameters: [ { $ref: '#/components/parameters/JobOfferId' } ]
      responses:
        '200': { description: Supprimée. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================ EMPLOIS - CANDIDATURES
  /api/job-offers/{jobOffer}/apply:
    post:
      tags: [Emplois - Candidatures]
      summary: Postuler à une offre (chercheur d'emploi)
      description: L'offre doit être `is_active` (404 sinon). Doublon → 409.
      parameters: [ { $ref: '#/components/parameters/JobOfferId' } ]
      responses:
        '201': { description: Candidature créée., content: { application/json: { schema: { $ref: '#/components/schemas/JobApplication' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/job-seeker/applications:
    get:
      tags: [Emplois - Candidatures]
      summary: Mes candidatures (chercheur d'emploi)
      parameters: [ { $ref: '#/components/parameters/StatusFilter' } ]
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/job-seeker/applications/{application}/withdraw:
    post:
      tags: [Emplois - Candidatures]
      summary: Retirer une candidature (chercheur d'emploi)
      description: Autorisé uniquement si la candidature est encore `pending` (422 sinon).
      parameters: [ { $ref: '#/components/parameters/ApplicationId' } ]
      responses:
        '200': { description: Retirée. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableState' }

  /api/recruiter/job-offers/{jobOffer}/applications:
    get:
      tags: [Emplois - Candidatures]
      summary: Candidatures reçues sur une offre (recruteur)
      parameters:
        - { $ref: '#/components/parameters/JobOfferId' }
        - { $ref: '#/components/parameters/StatusFilter' }
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/recruiter/applications/{application}/status:
    patch:
      tags: [Emplois - Candidatures]
      summary: Changer le statut d'une candidature (recruteur)
      description: 'Transitions : `pending→accepted|rejected`, `accepted→completed`.'
      parameters: [ { $ref: '#/components/parameters/ApplicationId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [accepted, rejected, completed] }
      responses:
        '200': { description: Statut mis à jour., content: { application/json: { schema: { $ref: '#/components/schemas/JobApplication' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableState' }

  # ============================================================ EMPLOIS - ANNUAIRE
  /api/job-seekers:
    get:
      tags: [Emplois - Annuaire]
      summary: Annuaire public des chercheurs d'emploi
      parameters:
        - { name: search, in: query, schema: { type: string }, description: 'Recherche sur profession/availability.' }
        - { name: availability, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }

  /api/job-seekers/{jobSeeker}:
    get:
      tags: [Emplois - Annuaire]
      summary: Profil public d'un chercheur d'emploi
      parameters: [ { name: jobSeeker, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Profil., content: { application/json: { schema: { $ref: '#/components/schemas/JobSeeker' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================ PAIEMENTS
  /api/payments:
    get:
      tags: [Paiements]
      summary: Mes paiements
      parameters:
        - { $ref: '#/components/parameters/StatusFilter' }
        - { name: reference_type, in: query, schema: { type: string, enum: [order, reservation, subscription] } }
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
    post:
      tags: [Paiements]
      summary: Initier un paiement mobile money
      description: |
        Montant résolu **côté serveur** depuis l'entité référencée (jamais le body).
        Crée un paiement `pending` puis déclenche le push USSD PayGate.
        Refus passerelle → **502** (paiement marqué `failed`).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StorePaymentRequest' } } } }
      responses:
        '201': { description: Paiement initié., content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/GatewayError' }

  /api/payments/{payment}:
    get:
      tags: [Paiements]
      summary: Détail d'un de mes paiements
      parameters: [ { $ref: '#/components/parameters/PaymentId' } ]
      responses:
        '200': { description: Paiement., content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/payments/{payment}/check:
    post:
      tags: [Paiements]
      summary: Rafraîchir le statut auprès de PayGate
      description: Interroge PayGate pour un paiement encore `pending`.
      parameters: [ { $ref: '#/components/parameters/PaymentId' } ]
      responses:
        '200': { description: Statut à jour., content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/GatewayError' }

  /api/payments/callback:
    post:
      tags: [Paiements]
      summary: Webhook PayGate Global (public)
      description: |
        Endpoint public, non authentifié, throttlé. Le corps posté n'est pas signé :
        il sert de simple déclencheur, le statut réel est relu depuis PayGate avant
        toute écriture. Répond toujours `200 {"received": true}`.
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayGateCallbackRequest' }
      responses:
        '200':
          description: Reçu.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, example: true }

  # ============================================================ ABONNEMENTS
  /api/subscriptions:
    get:
      tags: [Abonnements]
      summary: Catalogue des plans d'abonnement
      parameters:
        - { name: subscriber_type, in: query, schema: { type: string, enum: [property_owner, recruiter] } }
      responses:
        '200': { description: Liste des plans., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Subscription' } } } } }

  # ============================================================ PORTEFEUILLES & RETRAITS
  /api/vendor/wallet:
    get:
      tags: [Portefeuilles & Retraits]
      summary: Mon portefeuille (vendeur)
      responses:
        '200': { description: Portefeuille + transactions., content: { application/json: { schema: { $ref: '#/components/schemas/Wallet' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/driver/wallet:
    get:
      tags: [Portefeuilles & Retraits]
      summary: Mon portefeuille (livreur)
      responses:
        '200': { description: Portefeuille + transactions., content: { application/json: { schema: { $ref: '#/components/schemas/Wallet' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/withdrawals:
    get:
      tags: [Portefeuilles & Retraits]
      summary: Mes demandes de retrait (vendeur/livreur)
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Portefeuilles & Retraits]
      summary: Demander un retrait (vendeur/livreur)
      description: Le portefeuille est débité immédiatement (fonds réservés). Solde insuffisant → 422.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StoreWithdrawalRequest' } } } }
      responses:
        '201': { description: Demande créée., content: { application/json: { schema: { $ref: '#/components/schemas/WithdrawalRequest' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableState' }

  # ============================================================ ADRESSES
  /api/addresses:
    get:
      tags: [Adresses]
      summary: Mon carnet d'adresses
      responses:
        '200': { description: Adresses., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Address' } } } } }
    post:
      tags: [Adresses]
      summary: Ajouter une adresse
      description: La toute première adresse créée est toujours l'adresse par défaut.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressRequest' } } } }
      responses:
        '201': { description: Créée., content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/addresses/{address}:
    put:
      tags: [Adresses]
      summary: Mettre à jour une adresse
      parameters: [ { $ref: '#/components/parameters/AddressId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressRequest' } } } }
      responses:
        '200': { description: Mise à jour., content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Adresses]
      summary: Supprimer une adresse
      description: Supprimer l'adresse par défaut promeut la plus récente restante.
      parameters: [ { $ref: '#/components/parameters/AddressId' } ]
      responses:
        '200': { description: Supprimée. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/addresses/{address}/default:
    patch:
      tags: [Adresses]
      summary: Définir comme adresse par défaut
      parameters: [ { $ref: '#/components/parameters/AddressId' } ]
      responses:
        '200': { description: Adresse par défaut mise à jour., content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================ MESSAGERIE
  /api/messages:
    post:
      tags: [Messagerie]
      summary: Envoyer un message
      description: '`receiver_id` doit exister et ne pas être soi-même.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StoreMessageRequest' } } } }
      responses:
        '201': { description: Message envoyé., content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/conversations:
    get:
      tags: [Messagerie]
      summary: Mes conversations
      description: Une entrée par interlocuteur avec dernier message et nombre de non-lus.
      responses:
        '200': { description: Conversations., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Conversation' } } } } }

  /api/messages/{user}:
    get:
      tags: [Messagerie]
      summary: Fil de discussion avec un utilisateur
      description: Marque comme lus les messages de l'interlocuteur à mon égard. 404 si l'utilisateur n'existe pas.
      parameters: [ { name: user, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Fil., content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Message' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/messages/unread-count:
    get:
      tags: [Messagerie]
      summary: Nombre de messages non lus
      responses:
        '200': { description: Compteur., content: { application/json: { schema: { type: object, properties: { unread_count: { type: integer } } } } } }

  # ============================================================ NOTIFICATIONS
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Mes notifications
      parameters:
        - { name: unread, in: query, schema: { type: boolean }, description: '1 pour ne renvoyer que les non-lues.' }
        - { name: type, in: query, schema: { type: string }, description: 'Filtre par type (order, delivery, reservation, job, payment, message, rating, subscription, wallet...).' }
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }

  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Nombre de notifications non lues
      responses:
        '200': { description: Compteur., content: { application/json: { schema: { type: object, properties: { unread_count: { type: integer } } } } } }

  /api/notifications/{notification}/read:
    patch:
      tags: [Notifications]
      summary: Marquer une notification comme lue
