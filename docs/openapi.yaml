  /api/job-offers:
    get:
      tags: [Emplois - Offres]
      summary: Job board public
      description: Retourne uniquement les offres `is_active`.
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: recruiter_id, in: query, schema: { type: string, format: uuid } }
        - { name: min_rate, in: query, schema: { type: number } }
        - { name: max_rate, in: query, schema: { type: number } }
        - { $ref: '#/components/parameters/Page' }
      responses:
