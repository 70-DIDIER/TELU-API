openapi: 3.1.0

info:
  title: TELU BAOBAB API
  version: "1.0.0"
  description: |
    API REST du backend **TELU BAOBAB** — super-app multi-services ciblant le Togo.
    Une seule table `users` sert trois marketplaces, distingués par `users.user_type` :

    - **Commerce & livraison** — vendeurs → produits → commandes → livraisons (livreurs).
    - **Immobilier** — propriétaires → biens → réservations.
    - **Emplois** — recruteurs → offres, et chercheurs d'emploi → candidatures.

    Transverses : abonnements, paiements (mobile money via PayGate), OTP SMS (AfrikSMS),
    messagerie, notifications, notes/avis, portefeuilles & retraits, back-office admin.

    ## Authentification
    Jetons **Laravel Sanctum** (Bearer). Récupérez un jeton via `POST /api/auth/register`
    ou `POST /api/auth/login`, puis envoyez-le dans l'en-tête `Authorization: Bearer <token>`.
    Les routes publiques (auth, OTP, mot de passe oublié, catalogue, webhook PayGate) ne
    requièrent pas de jeton.

    ## Conventions
    - Toutes les clés primaires sont des **UUID**.
    - Les montants sont en **XOF (FCFA)**, sans sous-unité.
    - Codes d'erreur métier récurrents : **403** (mauvais profil / non-propriétaire),
      **404** (introuvable ou non accessible), **409** (conflit / doublon),
      **422** (validation ou transition d'état interdite), **502** (passerelle PayGate injoignable).
    - Les erreurs `api/*` sont toujours rendues en JSON.

servers:
  - url: http://localhost:8000
    description: Développement local (php artisan serve)
  - url: https://api.telu.tg
    description: Production (exemple)

tags:
  - name: Auth
    description: Inscription, connexion, profil du compte, déconnexion.
  - name: OTP & Mot de passe
    description: Vérification du numéro par SMS et réinitialisation du mot de passe.
  - name: Profils métier
    description: Profil unique de l'utilisateur selon son user_type (vendeur, livreur, propriétaire, recruteur, chercheur d'emploi).
  - name: Commerce - Catalogue
    description: Catalogue public de produits et gestion côté vendeur.
  - name: Commerce - Commandes
    description: Cycle de vie commande → livraison → confirmation.
  - name: Commerce - Livraisons
    description: Pool de livraisons et actions du livreur.
  - name: Immobilier - Biens
    description: Catalogue public de biens et gestion côté propriétaire.
  - name: Immobilier - Réservations
    description: Réservations côté client et côté propriétaire.
  - name: Emplois - Offres
    description: Job board public et gestion côté recruteur.
  - name: Emplois - Candidatures
    description: Candidatures côté chercheur d'emploi et côté recruteur.
  - name: Emplois - Annuaire
    description: Annuaire public des chercheurs d'emploi (sourcing).
  - name: Paiements
    description: Paiements mobile money (Flooz / TMoney) via PayGate Global.
  - name: Abonnements
    description: Catalogue des plans d'abonnement.
  - name: Portefeuilles & Retraits
    description: Portefeuille de commission des vendeurs/livreurs et demandes de retrait.
  - name: Adresses
    description: Carnet d'adresses de livraison de l'utilisateur.
  - name: Messagerie
    description: Chat direct 1-à-1.
  - name: Notifications
    description: Notifications applicatives de l'utilisateur.
  - name: Notes & Avis
    description: Notation des profils métier (1–5).
  - name: Admin - Utilisateurs & Stats
    description: Back-office (user_type = admin uniquement).
  - name: Admin - Catalogues
    description: Supervision commerce / immobilier / emplois.
  - name: Admin - Finance
    description: Abonnements, réglages, retraits.

security:
  - bearerAuth: []

paths:

  # ============================================================ AUTH
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Inscription
      description: Crée un compte et retourne un jeton Sanctum. `otp_token` devient requis si `OTP_REQUIRED_FOR_REGISTRATION=true`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Compte créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Connexion
      description: Le champ `login` est auto-détecté comme email ou téléphone.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Connecté.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Profil du compte authentifié
      responses:
        '200':
          description: Utilisateur courant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Auth]
      summary: Mise à jour du profil du compte
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Profil mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion (révoque le jeton courant)
      responses:
        '200': { description: Déconnecté. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============================================================ OTP & PASSWORD
  /api/auth/otp/send:
    post:
      tags: [OTP & Mot de passe]
      summary: Envoi d'un code OTP (inscription, numéro sans compte)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneRequest' }
      responses:
        '200': { description: Code envoyé (jamais renvoyé dans la réponse). }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/GatewayError' }

  /api/auth/otp/verify:
    post:
      tags: [OTP & Mot de passe]
      summary: Vérification du code OTP (inscription)
      description: Retourne un `verification_token` à usage unique (valide 30 min) à passer à `POST /api/auth/register`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200':
          description: Code vérifié.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_token: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/auth/password/forgot:
    post:
      tags: [OTP & Mot de passe]
      summary: Mot de passe oublié — envoi du code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneRequest' }
      responses:
        '200': { description: Code envoyé si un compte existe. }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/password/verify:
    post:
      tags: [OTP & Mot de passe]
      summary: Mot de passe oublié — vérification du code
      description: Retourne un `reset_token` à usage unique.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200':
          description: Code vérifié.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset_token: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/auth/password/reset:
    post:
      tags: [OTP & Mot de passe]
      summary: Mot de passe oublié — réinitialisation
      description: Réinitialise le mot de passe et révoque tous les jetons Sanctum de l'utilisateur.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { description: Mot de passe réinitialisé. }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/otp/send:
    post:
      tags: [OTP & Mot de passe]
      summary: Envoi OTP pour le numéro déjà lié au compte (authentifié)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneRequest' }
      responses:
        '200': { description: Code envoyé. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/otp/verify:
    post:
      tags: [OTP & Mot de passe]
      summary: Vérification OTP du numéro du compte (authentifié)
      description: Marque le numéro comme vérifié (`is_verified`, `phone_verified_at`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200': { description: Numéro vérifié. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ============================================================ PROFILS MÉTIER
  /api/vendor:
    get:
      tags: [Profils métier]
      summary: Mon profil vendeur
      responses:
        '200': { description: Profil vendeur., content: { application/json: { schema: { $ref: '#/components/schemas/Vendor' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Profils métier]
      summary: Créer mon profil vendeur
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VendorProfileRequest' } } } }
      responses:
        '201': { description: Créé., content: { application/json: { schema: { $ref: '#/components/schemas/Vendor' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Profils métier]
      summary: Mettre à jour mon profil vendeur
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VendorProfileRequest' } } } }
      responses:
        '200': { description: Mis à jour., content: { application/json: { schema: { $ref: '#/components/schemas/Vendor' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/driver:
    get:
      tags: [Profils métier]
      summary: Mon profil livreur
      responses:
        '200': { description: Profil livreur., content: { application/json: { schema: { $ref: '#/components/schemas/Driver' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Profils métier]
      summary: Créer mon profil livreur
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DriverProfileRequest' } } } }
      responses:
        '201': { description: Créé., content: { application/json: { schema: { $ref: '#/components/schemas/Driver' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Profils métier]
      summary: Mettre à jour mon profil livreur
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DriverProfileRequest' } } } }
      responses:
        '200': { description: Mis à jour., content: { application/json: { schema: { $ref: '#/components/schemas/Driver' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/property-owner:
    get:
      tags: [Profils métier]
      summary: Mon profil propriétaire
      responses:
        '200': { description: Profil propriétaire., content: { application/json: { schema: { $ref: '#/components/schemas/PropertyOwner' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Profils métier]
      summary: Créer mon profil propriétaire
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyOwnerProfileRequest' } } } }
      responses:
        '201': { description: Créé., content: { application/json: { schema: { $ref: '#/components/schemas/PropertyOwner' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Profils métier]
      summary: Mettre à jour mon profil propriétaire
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyOwnerProfileRequest' } } } }
      responses:
        '200': { description: Mis à jour., content: { application/json: { schema: { $ref: '#/components/schemas/PropertyOwner' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/recruiter:
    get:
      tags: [Profils métier]
      summary: Mon profil recruteur
      responses:
        '200': { description: Profil recruteur., content: { application/json: { schema: { $ref: '#/components/schemas/Recruiter' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Profils métier]
      summary: Créer mon profil recruteur
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecruiterProfileRequest' } } } }
      responses:
        '201': { description: Créé., content: { application/json: { schema: { $ref: '#/components/schemas/Recruiter' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      tags: [Profils métier]
      summary: Mettre à jour mon profil recruteur
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecruiterProfileRequest' } } } }
      responses:
        '200': { description: Mis à jour., content: { application/json: { schema: { $ref: '#/components/schemas/Recruiter' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/job-seeker:
    get:
      tags: [Profils métier]
      summary: Mon profil chercheur d'emploi
      responses:
        '200': { description: Profil chercheur d'emploi., content: { application/json: { schema: { $ref: '#/components/schemas/JobSeeker' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Profils métier]
      summary: Créer mon profil chercheur d'emploi
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JobSeekerProfileRequest' } } } }
      responses:
        '201': { description: Créé., content: { application/json: { schema: { $ref: '#/components/schemas/JobSeeker' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      tags: [Profils métier]
      summary: Mettre à jour mon profil chercheur d'emploi
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JobSeekerProfileRequest' } } } }
      responses:
        '200': { description: Mis à jour., content: { application/json: { schema: { $ref: '#/components/schemas/JobSeeker' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================ COMMERCE - CATALOGUE
  /api/products:
    get:
      tags: [Commerce - Catalogue]
      summary: Catalogue public de produits
      description: Retourne uniquement les produits `is_available`.
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: vendor_id, in: query, schema: { type: string, format: uuid } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }

  /api/products/{product}:
    get:
      tags: [Commerce - Catalogue]
      summary: Détail d'un produit
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      responses:
        '200': { description: Produit., content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/vendor/products:
    get:
      tags: [Commerce - Catalogue]
      summary: Mes produits (vendeur)
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Commerce - Catalogue]
      summary: Créer un produit (vendeur)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRequest' } } } }
      responses:
        '201': { description: Créé., content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/vendor/products/{product}:
    get:
      tags: [Commerce - Catalogue]
      summary: Détail d'un de mes produits (vendeur)
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      responses:
        '200': { description: Produit., content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Commerce - Catalogue]
      summary: Mettre à jour un de mes produits (vendeur)
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductRequest' } } } }
      responses:
        '200': { description: Mis à jour., content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Commerce - Catalogue]
      summary: Supprimer un de mes produits (vendeur)
      parameters: [ { $ref: '#/components/parameters/ProductId' } ]
      responses:
        '200': { description: Supprimé. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================ COMMERCE - COMMANDES
  /api/orders:
    get:
      tags: [Commerce - Commandes]
      summary: Mes commandes (client)
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
    post:
      tags: [Commerce - Commandes]
      summary: Passer une commande (client)
      description: Total calculé côté serveur. Tous les articles doivent appartenir au même vendeur, être disponibles et en stock.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StoreOrderRequest' } } } }
      responses:
        '201': { description: Commande créée., content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/orders/{order}:
    get:
      tags: [Commerce - Commandes]
      summary: Détail d'une de mes commandes (client)
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200': { description: Commande., content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orders/{order}/confirm-receipt:
    post:
      tags: [Commerce - Commandes]
      summary: Confirmer la réception (client)
      description: Autorisé uniquement quand la commande est `in_delivery`. Clôture commande et livraison en `delivered` et déclenche le règlement des portefeuilles.
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200': { description: Réception confirmée., content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableState' }

  /api/vendor/orders:
    get:
      tags: [Commerce - Commandes]
      summary: Commandes reçues (vendeur)
      parameters: [ { $ref: '#/components/parameters/StatusFilter' } ]
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/vendor/orders/{order}:
    get:
      tags: [Commerce - Commandes]
      summary: Détail d'une commande reçue (vendeur)
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200': { description: Commande., content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/vendor/orders/{order}/status:
    patch:
      tags: [Commerce - Commandes]
      summary: Changer le statut d'une commande (vendeur)
      description: |
        Transitions autorisées : `pending→accepted|cancelled`, `accepted→preparing|cancelled`,
        `preparing→cancelled`. À l'acceptation : déduction du stock + création de la livraison.
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [accepted, preparing, cancelled] }
      responses:
        '200': { description: Statut mis à jour., content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableState' }

  # ============================================================ COMMERCE - LIVRAISONS
  /api/driver/deliveries/available:
    get:
      tags: [Commerce - Livraisons]
      summary: Pool des livraisons disponibles (livreur)
      responses:
        '200': { description: Livraisons `awaiting_driver`., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/driver/deliveries:
    get:
      tags: [Commerce - Livraisons]
      summary: Mes livraisons (livreur)
      parameters: [ { $ref: '#/components/parameters/StatusFilter' } ]
      responses:
        '200': { description: Liste paginée., content: { application/json: { schema: { $ref: '#/components/schemas/Paginated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/driver/deliveries/{delivery}/claim:
    post:
      tags: [Commerce - Livraisons]
      summary: Prendre une livraison (livreur)
      description: Concurrence sûre (`lockForUpdate`) — le premier livreur gagne, les autres reçoivent 422.
      parameters: [ { $ref: '#/components/parameters/DeliveryId' } ]
      responses:
        '200': { description: Livraison assignée., content: { application/json: { schema: { $ref: '#/components/schemas/Delivery' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
